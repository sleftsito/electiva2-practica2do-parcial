---
- name: Configurar servidores Ubuntu del laboratorio
  hosts: docker
  gather_facts: true

  tasks:
    - name: Mostrar el nombre del host
      ansible.builtin.debug:
        msg: "Nombre del servidor: {{ ansible_facts.hostname }}"

    - name: Mostrar el sistema operativo
      ansible.builtin.debug:
        msg: "Sistema operativo: {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}"

    - name: Crear el directorio de trabajo
      ansible.builtin.file:
        path: /tmp/ansible-demo
        state: directory
        mode: "0755"

    - name: Crear info.txt con los datos del servidor
      ansible.builtin.copy:
        dest: /tmp/ansible-demo/info.txt
        content: |
          Servidor: {{ ansible_facts.hostname }}
          Sistema operativo: {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}
        mode: "0644"

    - name: Crear subdirectorios
      ansible.builtin.file:
        path: "/tmp/ansible-demo/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - logs
        - backup
        - config

    - name: Mostrar mensaje para Ubuntu
      ansible.builtin.debug:
        msg: "{{ ansible_facts.hostname }} ejecuta Ubuntu."
      when: ansible_facts.distribution == "Ubuntu"
